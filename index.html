<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cháy gia đình</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  body{font-family:system-ui,sans-serif;background:#f4f5f7;margin:0;padding:16px;color:#222}
  h1{font-size:20px} .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .card{flex:1;min-width:220px;background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px #0002}
  .label{font-size:13px;color:#666} .value{font-size:36px;font-weight:600}
  .danger{color:#d32f2f} button{padding:10px 18px;border:0;border-radius:8px;font-size:15px;cursor:pointer;background:#ccc}
  button.on{background:#2e7d32;color:#fff} .status{font-size:13px;margin-bottom:8px}
</style>
</head>
<body>
<h1>🔥 Hệ thống báo cháy gia đình</h1>
<div class="status" id="status">Đang kết nối MQTT...</div>

<div class="row">
  <div class="card"><div class="label">Nồng độ khí gas/khói (ADC)</div><div class="value gas-value" id="gas">--</div></div>
  <div class="card"><div class="label">Nhiệt độ (°C)</div><div class="value temp-value" id="temp">--</div></div>
</div>

<div class="row">
  <div class="card"><canvas id="gasChart"></canvas></div>
  <div class="card"><canvas id="tempChart"></canvas></div>
</div>

<div class="card">
  <div class="label">Điều khiển thủ công</div><br>
  <button id="btnFan">Quạt: AUTO</button>
  <button id="btnPump">Máy bơm: AUTO</button>
  <button id="btnAuto">Về chế độ tự động</button>
</div>

<script>
const T = { data:"nhom1/baocay/data", fan:"nhom1/baocay/fan", pump:"nhom1/baocay/pump" };
const GAS_TH = 2000, TEMP_TH = 50;

function makeChart(id, label, color){
  return new Chart(document.getElementById(id), {
    type:"line",
    data:{labels:[], datasets:[{label, data:[], borderColor:color, tension:.3, pointRadius:0}]},
    options:{animation:false, scales:{x:{display:false}}}
  });
}
const gasChart = makeChart("gasChart","Khí gas","#e65100");
const tempChart = makeChart("tempChart","Nhiệt độ (°C)","#1565c0");
function push(ch, v){
  const t = new Date().toLocaleTimeString();
  ch.data.labels.push(t); ch.data.datasets[0].data.push(v);
  if(ch.data.labels.length > 30){ ch.data.labels.shift(); ch.data.datasets[0].data.shift(); }
  ch.update();
}

const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");
client.on("connect", () => { document.getElementById("status").textContent = "✅ Đã kết nối MQTT"; client.subscribe(T.data); });
client.on("error", e => document.getElementById("status").textContent = "❌ Lỗi MQTT: " + e.message);
client.on("message", (topic, msg) => {
  try {
    const d = JSON.parse(msg.toString());
    const g = document.getElementById("gas"), t = document.getElementById("temp");
    g.textContent = d.gas; t.textContent = d.temp.toFixed(1);
    g.classList.toggle("danger", d.gas > GAS_TH);
    t.classList.toggle("danger", d.temp > TEMP_TH);
    push(gasChart, d.gas); push(tempChart, d.temp);
  } catch(e){}
});

const state = { fan:"AUTO", pump:"AUTO" };
function bind(btnId, key, name){
  const b = document.getElementById(btnId);
  b.onclick = () => {
    state[key] = state[key] === "ON" ? "OFF" : "ON";
    client.publish(T[key], state[key]);
    render();
  };
}
function render(){
  for (const [id,key,name] of [["btnFan","fan","Quạt"],["btnPump","pump","Máy bơm"]]){
    const b = document.getElementById(id);
    b.textContent = name + ": " + state[key];
    b.classList.toggle("on", state[key] === "ON");
  }
}
bind("btnFan","fan"); bind("btnPump","pump");
document.getElementById("btnAuto").onclick = () => {
  state.fan = state.pump = "AUTO";
  client.publish(T.fan,"AUTO"); client.publish(T.pump,"AUTO"); render();
};
</script>
</body>
</html>
