<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cháy gia đình</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  body{font-family:system-ui,sans-serif;background:#f4f5f7;margin:0;padding:16px;color:#222}
  h1{font-size:20px}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .card{flex:1;min-width:220px;background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px #0002}
  .label{font-size:13px;color:#666}
  .value{font-size:36px;font-weight:600}
  .danger{color:#d32f2f}
  button{padding:10px 18px;border:0;border-radius:8px;font-size:15px;cursor:pointer;background:#ccc;margin-right:6px}
  button.on{background:#2e7d32;color:#fff}
  .status{font-size:13px;margin-bottom:8px}
</style>
</head>
<body>
<h1>🔥 Hệ thống báo cháy gia đình</h1>
<div class="status" id="status">Đang kết nối MQTT...</div>

<div class="row">
  <div class="card">
    <div class="label">Nồng độ khí gas/khói (%)</div>
    <div class="value gas-value" id="gas">--</div>
  </div>
  <div class="card">
    <div class="label">Nhiệt độ (°C)</div>
    <div class="value temp-value" id="temp">--</div>
  </div>
</div>

<div class="row">
  <div class="card"><canvas id="gasChart"></canvas></div>
  <div class="card"><canvas id="tempChart"></canvas></div>
</div>

<div class="card">
  <div class="label">Điều khiển thủ công</div><br>
  <button id="btnFan">Quạt: --</button>
  <button id="btnPump">Máy bơm: --</button>
  <button id="btnAuto">Về chế độ tự động</button>
</div>

<script>
const ID = "PHAMTIENLUC";
const T = {
  gas:       ID + "/gas",
  temp:      ID + "/temperature",
  fanSet:    ID + "/fan/set",
  pumpSet:   ID + "/pump/set",
  fanState:  ID + "/fan/state",
  pumpState: ID + "/pump/state"
};
const GAS_TH = 40, TEMP_TH = 35;   // trùng với ngưỡng trong code ESP32

function makeChart(id, label, color){
  return new Chart(document.getElementById(id), {
    type: "line",
    data: { labels: [], datasets: [{ label, data: [], borderColor: color, tension: .3, pointRadius: 0 }] },
    options: { animation: false, scales: { x: { display: false } } }
  });
}
const gasChart  = makeChart("gasChart",  "Khí gas (%)",     "#e65100");
const tempChart = makeChart("tempChart", "Nhiệt độ (°C)",   "#1565c0");

function push(ch, v){
  ch.data.labels.push(new Date().toLocaleTimeString());
  ch.data.datasets[0].data.push(v);
  if (ch.data.labels.length > 30){ ch.data.labels.shift(); ch.data.datasets[0].data.shift(); }
  ch.update();
}

const state = { fan: "--", pump: "--" };
function render(){
  const f = document.getElementById("btnFan"), p = document.getElementById("btnPump");
  f.textContent = "Quạt: " + state.fan;       f.classList.toggle("on", state.fan === "ON");
  p.textContent = "Máy bơm: " + state.pump;   p.classList.toggle("on", state.pump === "ON");
}

const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

client.on("connect", () => {
  document.getElementById("status").textContent = "✅ Đã kết nối MQTT";
  client.subscribe([T.gas, T.temp, T.fanState, T.pumpState]);
});
client.on("error", e => {
  document.getElementById("status").textContent = "❌ Lỗi MQTT: " + e.message;
});

client.on("message", (topic, msg) => {
  const s = msg.toString().trim();
  if (topic === T.gas){
    const v = parseFloat(s);
    const el = document.getElementById("gas");
    el.textContent = v.toFixed(1);
    el.classList.toggle("danger", v > GAS_TH);
    push(gasChart, v);
  } else if (topic === T.temp){
    const v = parseFloat(s);
    const el = document.getElementById("temp");
    el.textContent = v.toFixed(1);
    el.classList.toggle("danger", v > TEMP_TH);
    push(tempChart, v);
  } else if (topic === T.fanState){
    state.fan = s; render();
  } else if (topic === T.pumpState){
    state.pump = s; render();
  }
});

// Bấm nút: đảo trạng thái hiện tại (ON <-> OFF), chế độ manual
document.getElementById("btnFan").onclick  = () =>
  client.publish(T.fanSet,  state.fan  === "ON" ? "OFF" : "ON");
document.getElementById("btnPump").onclick = () =>
  client.publish(T.pumpSet, state.pump === "ON" ? "OFF" : "ON");

// Trả về chế độ tự động
document.getElementById("btnAuto").onclick = () => {
  client.publish(T.fanSet,  "AUTO");
  client.publish(T.pumpSet, "AUTO");
};
</script>
</body>
</html>
